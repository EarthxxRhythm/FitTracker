<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FitTracker · 训练页原型</title>
<style>
  /* ────────────────────────────────────────────────────────────────
     FitTracker · Cold Emerald Performance（沿用首页设计系统）
     训练页：多邻国进度条 + 3D 动作演示 + 完成组数 + 提交弹窗
     ──────────────────────────────────────────────────────────────── */
  :root {
    --ink-0: #0B0F13;
    --ink-1: #0A0D12;
    --ink-welcome-0: #10171B;
    --visual-a: #14241F;
    --visual-b: #0D1616;
    --ring-inner: #0D1117;
    --tab-pill: #141F1D;
    --tab-pill-active: #182422;
    --nav-active: #F3FBF7;
    --nav-inactive: rgba(243,251,247,.56);
    --accent: #50ECA7;
    --accent-deep: #45C9A1;
    --accent-soft: #8CEBCC;
    --cta-a: #47D994;
    --cta-b: #53E7A5;
    --cta-hover-a: #5BE3A5;
    --cta-hover-b: #6BEDB5;
    --on-accent: #07100B;
    --on-accent-2: #08110D;
    --txt-hi: #F7FBF8;
    --txt-body: #EDF6F2;
    --white-90: rgba(243,251,247,.90);
    --white-87: rgba(255,255,255,.87);
    --white-70: rgba(255,255,255,.70);
    --white-65: rgba(255,255,255,.65);
    --white-62: rgba(255,255,255,.62);
    --white-60: rgba(255,255,255,.60);
    --white-54: rgba(255,255,255,.54);
    --white-40: rgba(255,255,255,.40);
    --white-32: rgba(255,255,255,.32);
    --glass-10: rgba(255,255,255,.10);
    --glass-8: rgba(255,255,255,.08);
    --glass-6: rgba(255,255,255,.06);
    --glass-4: rgba(255,255,255,.04);
    --hairline: rgba(255,255,255,.06);
    --line-10: rgba(255,255,255,.10);
    --line-14: rgba(255,255,255,.078);
    --line-16: rgba(255,255,255,.16);
    --accent-40: rgba(80,236,167,.40);
    --accent-32: rgba(69,201,161,.32);
    --accent-20: rgba(80,236,167,.20);
    --accent-18: rgba(69,201,161,.18);
    --accent-17: rgba(80,236,167,.17);
    --accent-12: rgba(80,236,167,.12);
    --accent-10: rgba(80,236,167,.10);
    --accent-07: rgba(80,236,167,.07);
    --warn: #FFD7C5;
    --font-cn: "Noto Sans SC", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", "Microsoft YaHei UI", sans-serif;
    --font-num: "Inter", "SF Pro Text", -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    --font-mono: "Geist Mono", "JetBrains Mono", "SF Mono", Consolas, "Courier New", monospace;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }

  body {
    overflow-x: hidden;
    background: #07090B;
    color: var(--txt-body);
    font-family: var(--font-cn);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }

  .defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  button { font-family: var(--font-cn); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(80,236,167,.28); }

  /* ── 页面外框 ─────────────────────────────────────────────── */
  .page-header { max-width: 1120px; margin: 0 auto; padding: 48px 32px 8px; }
  .kicker {
    font-family: var(--font-cn);
    font-size: 13px;
    letter-spacing: .02em;
    color: var(--white-54);
    margin-bottom: 12px;
  }
  .page-header h1 {
    font-size: clamp(30px, 4vw, 44px);
    font-weight: 700;
    letter-spacing: 0;
    color: var(--txt-hi);
    line-height: 1.18;
  }
  .page-sub {
    margin-top: 14px;
    font-size: 15px;
    color: var(--white-60);
    line-height: 1.6;
    max-width: 640px;
  }
  .meta-row { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 20px; }
  .meta-badge {
    font-family: var(--font-cn);
    font-size: 12px;
    letter-spacing: .01em;
    color: var(--white-54);
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
  }
  .meta-badge b { color: var(--white-70); font-weight: 500; }

  .gallery {
    max-width: 1120px;
    margin: 0 auto;
    padding: 30px 32px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 40px;
    align-items: flex-start;
  }
  .frame-card { flex: 0 1 auto; }
  .stage-label { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px 4px; }
  .stage-label .name { font-size: 15px; font-weight: 600; color: var(--txt-hi); }
  .stage-label .code { font-family: var(--font-mono); font-size: 11px; color: var(--white-54); }
  .page-foot {
    max-width: 1120px;
    margin: 8px auto 48px;
    padding: 0 32px;
    font-size: 12px;
    color: var(--white-54);
    line-height: 1.7;
  }
  .page-foot b { color: var(--white-70); font-weight: 600; }

  .phone {
    position: relative;
    width: 390px;
    height: 844px;
    border-radius: 54px;
    border: 1px solid rgba(255,255,255,.10);
    background: #000;
    overflow: hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,.06) inset,
      0 0 0 1px rgba(0,0,0,.4),
      0 32px 80px rgba(0,0,0,.55),
      0 8px 28px rgba(0,0,0,.45);
  }
  .phone::after {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 44px;
    pointer-events: none;
    box-shadow: 0 0 0 1px rgba(255,255,255,.025) inset;
  }

  /* ── 训练页 ───────────────────────────────────────────────── */
  .wo-screen {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--ink-0);
  }

  .wo-top {
    flex: 0 0 auto;
    padding: 14px 18px 12px;
    background: rgba(10,13,18,.96);
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
  .progress-label { font-size: 12px; font-weight: 600; color: var(--white-70); }
  .top-timer { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--white-60); }
  .top-timer .total-val { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--txt-hi); }
  .top-timer .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: livePulse 1.6s ease infinite;
  }
  @keyframes livePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .45; transform: scale(.78); }
  }

  .duo-bar { display: flex; gap: 6px; }
  .duo-seg {
    position: relative;
    flex: 1 1 0;
    height: 12px;
    border-radius: 999px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.05);
  }
  .duo-seg.done { background: var(--accent); border-color: var(--accent); }
  .duo-seg.current { background: rgba(80,236,167,.16); border-color: rgba(80,236,167,.5); box-shadow: 0 0 0 2px rgba(80,236,167,.12); }
  .duo-marker {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--ink-0);
  }

  .wo-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .wo-scroll::-webkit-scrollbar { display: none; }
  .wo-content { padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 14px; }

  /* 3D 动作演示 */
  .demo-card {
    position: relative;
    height: 230px;
    border-radius: 28px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.08);
    background: #101816;
  }
  .demo-visual { width: 100%; height: 100%; display: block; }
  .demo-position {
    position: absolute;
    top: 14px; left: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(8,13,17,.82);
    border: 1px solid rgba(255,255,255,.1);
  }
  .demo-position-label { font-size: 11px; color: var(--white-60); }
  .demo-position-val { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--accent); }
  .demo-caption {
    position: absolute;
    left: 14px; right: 14px; bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 16px;
    background: rgba(8,13,17,.82);
    border: 1px solid rgba(255,255,255,.08);
  }
  .demo-name { font-size: 18px; font-weight: 700; color: var(--txt-hi); }
  .demo-phase { font-size: 12px; font-weight: 700; color: var(--accent); }

  /* 已完成组数 */
  .set-count {
    padding: 0;
  }
  .set-list { display: flex; flex-direction: column; gap: 10px; }
  .set-empty {
    padding: 16px;
    text-align: center;
    font-size: 13px;
    color: var(--white-54);
    border: 1px dashed rgba(255,255,255,.1);
    border-radius: 14px;
  }
  .set-record {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 44px;
    padding: 10px 12px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    animation: recordIn .18s var(--ease) both;
  }
  @keyframes recordIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  .rec-idx { font-size: 13px; color: var(--white-70); }
  .rec-val { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--txt-hi); }
  .rec-check { color: var(--accent); font-weight: 700; }

  .wo-dock {
    flex: 0 0 auto;
    padding: 12px 18px 18px;
    background: rgba(10,13,18,.98);
    border-top: 1px solid rgba(255,255,255,.06);
  }

  .wo-btn-primary {
    width: 100%;
    height: 50px;
    border: 0;
    border-radius: 16px;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(0,0,0,.24);
    transition: filter .18s ease, box-shadow .18s ease, transform .12s ease;
  }
  .wo-btn-primary:hover { filter: brightness(1.06); box-shadow: 0 12px 26px rgba(0,0,0,.28), 0 0 0 1px rgba(83,231,165,.25); }
  .wo-btn-primary:active { transform: scale(.985); }
  .wo-btn-primary:disabled { background: rgba(255,255,255,.06); color: var(--white-40); cursor: default; box-shadow: none; }

  .btn-ghost {
    width: 100%;
    height: 44px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.03);
    color: var(--white-70);
    border-radius: 14px;
    font-size: 14px;
    cursor: pointer;
    transition: background .16s ease;
  }
  .btn-ghost:hover { background: rgba(255,255,255,.07); }

  /* ── 提交弹窗 ─────────────────────────────────────────────── */
  .modal {
    position: absolute; inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(3,6,6,.72);
  }
  .modal.open { display: flex; animation: backdropIn .22s ease both; }
  @keyframes backdropIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .modal-card {
    width: 100%;
    max-width: 342px;
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,.10);
    background: #101816;
    box-shadow: 0 28px 60px rgba(0,0,0,.5);
    padding: 20px;
    animation: modalIn .22s var(--ease);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(12px) scale(.98); }
    to { opacity: 1; transform: none; }
  }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .modal-titles { min-width: 0; }
  .modal-eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .08em;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .modal-title { font-size: 22px; font-weight: 700; color: var(--txt-hi); line-height: 1.2; }
  .modal-sub { margin-top: 4px; font-size: 13px; color: var(--white-60); }
  .modal-close {
    flex: 0 0 auto;
    width: 36px; height: 36px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.03);
    color: var(--white-70);
    border-radius: 50%;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background .16s ease, color .16s ease;
  }
  .modal-close:hover { background: rgba(255,255,255,.08); color: var(--txt-hi); }
  .modal-fields { display: flex; gap: 12px; margin: 18px 0 16px; }
  .modal-actions { display: flex; flex-direction: column; gap: 8px; }

  .input-box {
    flex: 1 1 0; min-width: 0;
    background: rgba(255,255,255,.0235);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 17px;
    padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .input-box .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .input-box .top .lb { font-size: 12px; color: var(--white-60); }
  .input-box .top .un { font-family: var(--font-mono); font-size: 10px; color: var(--accent); }
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .stepper .step {
    width: 36px; height: 36px;
    border: 1px solid rgba(255,255,255,.06);
    background: rgba(255,255,255,.031);
    border-radius: 10px;
    color: var(--white-60);
    font-size: 16px;
    cursor: pointer;
    transition: background .16s ease;
  }
  .stepper .step:hover { background: rgba(255,255,255,.09); }
  .stepper .val {
    font-family: var(--font-mono);
    font-size: 24px;
    line-height: 1;
    font-weight: 700;
    color: var(--txt-hi);
    text-align: center;
  }

  /* ── 完成组庆祝动画 ───────────────────────────────────────── */
  .celebrate {
    position: absolute; inset: 0;
    z-index: 20;
    display: none;
    overflow: hidden;
    pointer-events: none;
    background: rgba(11, 15, 19, .55);
    backdrop-filter: blur(18px) saturate(1.06);
    -webkit-backdrop-filter: blur(18px) saturate(1.06);
  }
  .celebrate.playing { display: block; animation: veilIn .22s var(--ease) both; }
  .celebrate.fading { animation: veilOut .3s var(--ease) forwards; }
  @keyframes veilIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes veilOut { from { opacity: 1; } to { opacity: 0; } }
  .celebrate-particles { position: absolute; inset: 0; }
  .confetti {
    position: absolute;
    left: 50%; top: 42%;
    width: 8px; height: 14px;
    border-radius: 2px;
    opacity: 0;
    transform: translate(-50%, -50%) rotate(0deg);
    animation: confettiFly 1.1s cubic-bezier(.16, .7, .3, 1) both;
  }
  @keyframes confettiFly {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.45) rotate(0deg); }
    10% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1) rotate(var(--rot)); }
  }
  .celebrate-core {
    position: absolute;
    left: 50%; top: 40%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0;
  }
  .celebrate.playing .celebrate-core { animation: coreIn .46s var(--ease) .06s both; }
  @keyframes coreIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.72); }
    60% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .celebrate-check {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--on-accent);
    display: grid;
    place-items: center;
    box-shadow:
      0 0 0 16px var(--accent-07),
      0 0 54px 20px var(--accent-20);
  }
  .celebrate-check svg { width: 42px; height: 42px; }
  .celebrate-text {
    font-size: 21px;
    font-weight: 700;
    color: var(--txt-hi);
    letter-spacing: .02em;
    text-shadow: 0 2px 12px rgba(0,0,0,.4);
  }
  .celebrate-sub {
    margin-top: -5px;
    font-size: 14px;
    font-weight: 500;
    color: var(--white-70);
    letter-spacing: .02em;
    text-shadow: 0 2px 10px rgba(0,0,0,.4);
  }

  /* 进度条填充反馈 */
  .duo-marker { animation: markerPop .3s var(--ease); }
  @keyframes markerPop {
    from { transform: translate(-50%, -50%) scale(.4); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
  .duo-seg.just-done { animation: segPop .46s var(--ease); }
  @keyframes segPop {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(80,236,167,.5); }
    40% { transform: scale(1.12); box-shadow: 0 0 16px 4px rgba(80,236,167,.35); }
    100% { transform: scale(1); }
  }

  /* ── 响应式 ───────────────────────────────────────────────── */
  @media (max-width: 860px) {
    .page-header { padding: 32px 20px 4px; }
    .gallery { padding: 24px 20px 8px; justify-content: center; }
    .page-foot { padding: 0 20px; }
  }
  @media (max-width: 440px) {
    .phone { transform-origin: top left; }
    .gallery { padding-left: 16px; padding-right: 16px; }
    .page-header, .page-foot { padding-left: 16px; padding-right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .top-timer .live-dot { animation: none; }
    .modal-card { animation: none; }
    .modal.open { animation: none; }
    .set-record { animation: none; }
    .duo-marker { animation: none; }
    .duo-seg.just-done { animation: none; }
    .celebrate.playing .celebrate-core { animation: none; opacity: 1; }
    .celebrate.playing { animation: none; }
    .celebrate.fading { animation: none; opacity: 0; }
    .confetti { animation: none; opacity: 0; }
    .wo-btn-primary { transition: none; }
    .wo-btn-primary:active { transform: none; }
  }
</style>
</head>
<body>

  <header class="page-header">
    <div class="kicker">FitTracker · Workout</div>
    <h1>训练执行</h1>
    <p class="page-sub">多邻国式进度条 · 3D 动作演示 · 完成本组庆祝动画 · 已完成组记录。</p>
    <div class="meta-row">
      <span class="meta-badge">主题 <b>Cold Emerald</b></span>
      <span class="meta-badge">视口 <b>390 × 844</b></span>
      <span class="meta-badge">交互 <b>完成本组 · 庆祝动画</b></span>
    </div>
  </header>

  <main class="gallery">
    <figure class="frame-card" data-od-id="screen-training">
      <div class="stage-label">
        <span class="name">训练执行</span>
        <span class="code">Active Workout</span>
      </div>

      <div class="phone">
        <div class="wo-screen">
          <div class="wo-top">
            <div class="top-row">
              <span class="progress-label">第 3 组 / 共 6 组</span>
              <span class="top-timer"><span class="live-dot"></span>总时长 <span class="total-val">00:00</span></span>
            </div>
            <div class="duo-bar" id="duo-bar" role="progressbar" aria-label="训练组数进度" aria-valuenow="2" aria-valuemin="0" aria-valuemax="6">
              <span class="duo-seg done"></span>
              <span class="duo-seg done"></span>
              <span class="duo-seg current"><span class="duo-marker"></span></span>
              <span class="duo-seg"></span>
              <span class="duo-seg"></span>
              <span class="duo-seg"></span>
            </div>
          </div>

          <div class="wo-scroll">
            <div class="wo-content">
              <article class="demo-card" data-od-id="exercise-demo">
                <div class="demo-position" data-od-id="exercise-position">
                  <span class="demo-position-label">动作</span>
                  <span class="demo-position-val">1 / 4</span>
                </div>
                <svg class="demo-visual" viewBox="0 0 360 230" preserveAspectRatio="none" role="img" aria-label="杠铃卧推 3D 演示图">
                  <defs>
                    <linearGradient id="benchGrad" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#2A3934"/>
                      <stop offset="1" stop-color="#16211F"/>
                    </linearGradient>
                    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#7E8F96"/>
                      <stop offset="1" stop-color="#3B4A45"/>
                    </linearGradient>
                    <radialGradient id="plateGrad" cx=".35" cy=".35" r=".9">
                      <stop offset="0" stop-color="#243B35"/>
                      <stop offset=".65" stop-color="#0F1716"/>
                      <stop offset="1" stop-color="#080D0C"/>
                    </radialGradient>
                  </defs>
                  <rect x="42" y="158" width="276" height="12" rx="6" fill="url(#benchGrad)"/>
                  <rect x="66" y="170" width="12" height="36" rx="4" fill="#101816"/>
                  <rect x="282" y="170" width="12" height="36" rx="4" fill="#101816"/>

                  <g fill="#0D1117" stroke="rgba(80,236,167,.16)" stroke-width="2">
                    <circle cx="176" cy="72" r="16"/>
                    <rect x="164" y="88" width="24" height="62" rx="12"/>
                    <path d="M168 100 L150 108" fill="none" stroke="#0D1117" stroke-width="12" stroke-linecap="round"/>
                    <path d="M184 100 L202 108" fill="none" stroke="#0D1117" stroke-width="12" stroke-linecap="round"/>
                    <rect x="188" y="142" width="64" height="15" rx="7"/>
                    <rect x="256" y="142" width="64" height="15" rx="7"/>
                  </g>

                  <rect x="24" y="100" width="312" height="8" rx="4" fill="url(#barGrad)"/>
                  <circle cx="40" cy="104" r="17" fill="url(#plateGrad)" stroke="#0B0F13" stroke-width="1.5"/>
                  <circle cx="58" cy="104" r="14" fill="url(#plateGrad)" stroke="#0B0F13" stroke-width="1.5"/>
                  <circle cx="320" cy="104" r="17" fill="url(#plateGrad)" stroke="#0B0F13" stroke-width="1.5"/>
                  <circle cx="302" cy="104" r="14" fill="url(#plateGrad)" stroke="#0B0F13" stroke-width="1.5"/>
                </svg>
                <div class="demo-caption">
                  <span class="demo-name">杠铃卧推</span>
                  <span class="demo-phase">第 2 组 · 正式组</span>
                </div>
              </article>

              <section class="set-count" data-od-id="set-count">
                <div class="set-list" id="set-list" aria-live="polite"></div>
              </section>
            </div>
          </div>

          <div class="wo-dock">
            <button type="button" class="wo-btn-primary" id="btn-submit">提交</button>
          </div>

          <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-card" tabindex="-1">
              <div class="modal-head">
                <div class="modal-titles">
                  <span class="modal-eyebrow">RECORD SET</span>
                  <div class="modal-title" id="modal-title">记录本组</div>
                  <div class="modal-sub">杠铃卧推 · 第 <span id="modal-set">3</span> 组</div>
                </div>
                <button type="button" class="modal-close" id="btn-close" aria-label="关闭弹窗">×</button>
              </div>
              <div class="modal-fields">
                <div class="input-box">
                  <div class="top"><span class="lb">重量</span><span class="un">KG</span></div>
                  <div class="stepper">
                    <button type="button" class="step" data-delta="down" data-increment="1" data-min="20" data-max="200" aria-label="减少重量">−</button>
                    <span class="val" data-field="weight">32</span>
                    <button type="button" class="step" data-delta="up" data-increment="1" data-min="20" data-max="200" aria-label="增加重量">+</button>
                  </div>
                </div>
                <div class="input-box">
                  <div class="top"><span class="lb">次数</span><span class="un">8–10</span></div>
                  <div class="stepper">
                    <button type="button" class="step" data-delta="down" data-increment="1" data-min="1" data-max="15" aria-label="减少次数">−</button>
                    <span class="val" data-field="reps">9</span>
                    <button type="button" class="step" data-delta="up" data-increment="1" data-min="1" data-max="15" aria-label="增加次数">+</button>
                  </div>
                </div>
              </div>
              <div class="modal-actions">
                <button type="button" class="wo-btn-primary" id="btn-complete">完成本组</button>
              </div>
            </div>
          </div>
          <div class="celebrate" id="celebrate" data-od-id="celebration" aria-hidden="true">
            <div class="celebrate-particles" id="celebrate-particles"></div>
            <div class="celebrate-core">
              <div class="celebrate-check">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <span class="celebrate-text">本组完成</span>
              <span class="celebrate-sub">做得很好</span>
            </div>
          </div>
        </div>
      </div>
    </figure>
  </main>

  <footer class="page-foot">
    <b>交互流程：</b>点击「提交」打开弹窗 → 调整重量与次数 → 点击「完成本组」→ 庆祝动画 → 进度条前进一格 → 下方新增一条组记录。
  </footer>

  <script>
    (function () {
      var totalEl = document.querySelector('.total-val');
      var modal = document.getElementById('modal');
      var btnSubmit = document.getElementById('btn-submit');
      var btnComplete = document.getElementById('btn-complete');
      var btnClose = document.getElementById('btn-close');
      var setList = document.getElementById('set-list');
      var modalSet = document.getElementById('modal-set');
      var duoBar = document.getElementById('duo-bar');
      var progressLabel = document.querySelector('.progress-label');
      var celebrate = document.getElementById('celebrate');
      var particles = document.getElementById('celebrate-particles');
      var segments = [];
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var target = 6;
      var records = [
        { weight: 30, reps: 10 },
        { weight: 32, reps: 9 }
      ];
      var completed = records.length;

      function formatClock(total) {
        total = Math.max(0, total);
        var h = Math.floor(total / 3600);
        var m = Math.floor((total % 3600) / 60);
        var s = total % 60;
        var mm = (m < 10 ? '0' : '') + m;
        var ss = (s < 10 ? '0' : '') + s;
        return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
      }

      var totalSeconds = 0;
      window.setInterval(function () {
        totalSeconds += 1;
        if (totalEl) { totalEl.textContent = formatClock(totalSeconds); }
      }, 1000);

      function renderSets(animateProgress) {
        completed = records.length;
        btnSubmit.disabled = completed >= target;
        btnSubmit.textContent = completed >= target ? '已完成' : '提交';

        setList.innerHTML = '';
        if (records.length === 0) {
          var empty = document.createElement('div');
          empty.className = 'set-empty';
          empty.textContent = '还没有完成组';
          setList.appendChild(empty);
        } else {
          records.forEach(function (r, i) {
            var row = document.createElement('div');
            row.className = 'set-record';
            row.innerHTML =
              '<span class="rec-idx">第 ' + (i + 1) + ' 组</span>' +
              '<span class="rec-val">' + r.weight + ' kg × ' + r.reps + '</span>' +
              '<span class="rec-check">✓</span>';
            setList.appendChild(row);
          });
        }
        updateProgress(animateProgress);
      }

      function updateProgress(animate) {
        if (segments.length !== target) {
          duoBar.innerHTML = '';
          segments = [];
          for (var i = 0; i < target; i++) {
            var seg = document.createElement('span');
            seg.className = 'duo-seg';
            duoBar.appendChild(seg);
            segments.push(seg);
          }
        }
        segments.forEach(function (seg, i) {
          seg.classList.remove('done', 'current', 'just-done');
          seg.innerHTML = '';
          if (i < completed) {
            seg.classList.add('done');
          } else if (i === completed && completed < target) {
            seg.classList.add('current');
            var marker = document.createElement('span');
            marker.className = 'duo-marker';
            seg.appendChild(marker);
          }
        });
        if (animate && completed > 0) {
          var last = segments[completed - 1];
          if (last) {
            last.classList.add('just-done');
            window.setTimeout(function () { last.classList.remove('just-done'); }, 460);
          }
        }
        var label = completed >= target
          ? '训练完成 · 全部 ' + target + ' 组'
          : '第 ' + (completed + 1) + ' 组 / 共 ' + target + ' 组';
        progressLabel.textContent = label;
        duoBar.setAttribute('aria-valuenow', String(completed));
        duoBar.setAttribute('aria-valuemax', String(target));
      }

      function spawnConfetti() {
        var colors = ['#50ECA7', '#8CEBCC', '#45C9A1', '#F7FBF8'];
        var count = 36;
        for (var i = 0; i < count; i++) {
          var p = document.createElement('span');
          p.className = 'confetti';
          var angle = (Math.PI * 2) * (i / count) + (Math.random() - 0.5) * 0.5;
          var dist = 90 + Math.random() * 150;
          p.style.setProperty('--tx', (Math.cos(angle) * dist).toFixed(1) + 'px');
          p.style.setProperty('--ty', (Math.sin(angle) * dist).toFixed(1) + 'px');
          p.style.setProperty('--rot', (Math.random() * 540 - 270).toFixed(0) + 'deg');
          p.style.background = colors[i % colors.length];
          p.style.animationDelay = (Math.random() * 0.08).toFixed(3) + 's';
          p.style.animationDuration = (0.9 + Math.random() * 0.35).toFixed(3) + 's';
          particles.appendChild(p);
        }
      }

      function playCelebration() {
        celebrate.classList.remove('playing', 'fading');
        particles.innerHTML = '';
        void celebrate.offsetWidth;
        if (!reduceMotion) { spawnConfetti(); }
        celebrate.classList.add('playing');
        window.clearTimeout(celebrate._timer);
        window.clearTimeout(celebrate._timer2);
        celebrate._timer = window.setTimeout(function () {
          celebrate.classList.add('fading');
        }, reduceMotion ? 760 : 1120);
        celebrate._timer2 = window.setTimeout(function () {
          celebrate.classList.remove('playing', 'fading');
        }, reduceMotion ? 1080 : 1500);
      }

      var lastFocused = null;

      function openModal() {
        if (completed >= target) { return; }
        modalSet.textContent = String(completed + 1);
        modal.classList.add('open');
        lastFocused = document.activeElement;
        var card = modal.querySelector('.modal-card');
        if (card) { card.focus(); }
      }

      function closeModal() {
        modal.classList.remove('open');
        if (lastFocused) { lastFocused.focus(); lastFocused = null; }
      }

      function completeSet() {
        if (completed >= target) { return; }
        var weightEl = document.querySelector('.val[data-field="weight"]');
        var repsEl = document.querySelector('.val[data-field="reps"]');
        var weight = parseFloat(weightEl && weightEl.textContent) || 0;
        var reps = parseInt(repsEl && repsEl.textContent, 10) || 0;
        records.push({ weight: weight, reps: reps });
        completed = records.length;
        btnSubmit.disabled = true;
        closeModal();
        playCelebration();
        window.setTimeout(function () {
          renderSets(true);
        }, 360);
      }

      btnSubmit.addEventListener('click', openModal);
      btnClose.addEventListener('click', closeModal);
      btnComplete.addEventListener('click', completeSet);
      modal.addEventListener('click', function (e) {
        if (e.target === modal) { closeModal(); }
      });
      modal.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { closeModal(); return; }
        if (e.key === 'Tab') {
          var focusables = Array.prototype.slice.call(modal.querySelectorAll('button'));
          if (focusables.length === 0) { return; }
          var first = focusables[0];
          var last = focusables[focusables.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });

      document.addEventListener('click', function (e) {
        var step = e.target.closest('.step');
        if (step) {
          var box = step.closest('.stepper');
          var val = box && box.querySelector('.val');
          if (val) {
            var inc = parseFloat(step.getAttribute('data-increment') || '1');
            var n = parseFloat(val.textContent) || 0;
            var min = parseFloat(step.getAttribute('data-min') || '0');
            var max = parseFloat(step.getAttribute('data-max') || '999');
            n = step.getAttribute('data-delta') === 'up' ? n + inc : n - inc;
            n = Math.min(max, Math.max(min, n));
            val.textContent = String(n);
          }
          return;
        }
      });

      function fitPhone() {
        var phone = document.querySelector('.phone');
        var narrow = window.innerWidth < 440;
        var scale = narrow ? Math.min(1, (window.innerWidth - 32) / 390) : 1;
        phone.style.transform = scale < 1 ? 'scale(' + scale + ')' : '';
        phone.style.transformOrigin = 'top left';
        phone.style.marginBottom = scale < 1 ? ((scale - 1) * 844) + 'px' : '';
      }
      window.addEventListener('resize', fitPhone);
      fitPhone();
      renderSets();
    })();
  </script>
  <script>window.FT_APP={routes:[],watchFinish:true};</script>
  <script src="assets/ft-stage.js"></script>
