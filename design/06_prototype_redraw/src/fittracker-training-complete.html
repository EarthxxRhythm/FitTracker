<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FitTracker · 训练完成页原型</title>
<style>
  /* ────────────────────────────────────────────────────────────────
     FitTracker · Cold Emerald Performance（沿用首页设计系统）
     训练完成页：借鉴多邻国完成流程 —— 庆祝 → 连续记录 → 继续
     ──────────────────────────────────────────────────────────────── */
  :root {
    --ink-0: #0B0F13;
    --ink-1: #0A0D12;
    --ink-welcome-0: #10171B;
    --visual-a: #14241F;
    --visual-b: #0D1616;
    --ring-inner: #0D1117;
    --tab-pill: #141F1D;
    --tab-pill-active: #182422;
    --nav-active: #F3FBF7;
    --nav-inactive: rgba(243,251,247,.56);
    --accent: #50ECA7;
    --accent-deep: #45C9A1;
    --accent-soft: #8CEBCC;
    --cta-a: #47D994;
    --cta-b: #53E7A5;
    --cta-hover-a: #5BE3A5;
    --cta-hover-b: #6BEDB5;
    --on-accent: #07100B;
    --on-accent-2: #08110D;
    --txt-hi: #F7FBF8;
    --txt-body: #EDF6F2;
    --white-90: rgba(243,251,247,.90);
    --white-87: rgba(255,255,255,.87);
    --white-70: rgba(255,255,255,.70);
    --white-65: rgba(255,255,255,.65);
    --white-62: rgba(255,255,255,.62);
    --white-60: rgba(255,255,255,.60);
    --white-54: rgba(255,255,255,.54);
    --white-40: rgba(255,255,255,.40);
    --white-32: rgba(255,255,255,.32);
    --glass-10: rgba(255,255,255,.10);
    --glass-8: rgba(255,255,255,.08);
    --glass-6: rgba(255,255,255,.06);
    --glass-4: rgba(255,255,255,.04);
    --hairline: rgba(255,255,255,.06);
    --line-10: rgba(255,255,255,.10);
    --line-14: rgba(255,255,255,.078);
    --line-16: rgba(255,255,255,.16);
    --accent-40: rgba(80,236,167,.40);
    --accent-32: rgba(69,201,161,.32);
    --accent-20: rgba(80,236,167,.20);
    --accent-18: rgba(69,201,161,.18);
    --accent-17: rgba(80,236,167,.17);
    --accent-12: rgba(80,236,167,.12);
    --accent-10: rgba(80,236,167,.10);
    --accent-07: rgba(80,236,167,.07);
    --warn: #FFD7C5;
    --font-cn: "Noto Sans SC", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", "Microsoft YaHei UI", sans-serif;
    --font-num: "Inter", "SF Pro Text", -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    --font-mono: "Geist Mono", "JetBrains Mono", "SF Mono", Consolas, "Courier New", monospace;
    --ease: cubic-bezier(.2, .7, .2, 1);

    /* ── 训练完成页补充 tokens（源自 WorkoutCompletePage.ets / PencilProfilePage.ets） */
    --complete-bg: #07100F;
    --complete-circle: #122D28;
    --complete-circle-border: rgba(80,236,167,.23);
    --complete-check: #7EF0CB;
    --complete-sub: rgba(255,255,255,.72);
    --streak-surface: #171C23;
    --streak-day-off: rgba(255,255,255,.078);
    --streak-day-on: #50ECA7;

    --scale: 0.90698;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }

  body {
    overflow-x: hidden;
    background: #07090B;
    color: var(--txt-body);
    font-family: var(--font-cn);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }

  button { font-family: var(--font-cn); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(80,236,167,.28); }

  /* ── 页面外框（非 App 内容） ─────────────────────────────────── */
  .page-header { max-width: 1120px; margin: 0 auto; padding: 48px 32px 8px; }
  .kicker {
    font-family: var(--font-cn);
    font-size: 13px;
    letter-spacing: .02em;
    color: var(--white-54);
    margin-bottom: 12px;
  }
  .page-header h1 {
    font-size: clamp(30px, 4vw, 44px);
    font-weight: 700;
    letter-spacing: 0;
    color: var(--txt-hi);
    line-height: 1.18;
  }
  .page-sub {
    margin-top: 14px;
    font-size: 15px;
    color: var(--white-60);
    line-height: 1.6;
    max-width: 640px;
  }
  .meta-row { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 20px; }
  .meta-badge {
    font-family: var(--font-cn);
    font-size: 12px;
    letter-spacing: .01em;
    color: var(--white-54);
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
  }
  .meta-badge b { color: var(--white-70); font-weight: 500; }

  .gallery {
    max-width: 1120px;
    margin: 0 auto;
    padding: 30px 32px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 40px;
    align-items: flex-start;
  }
  .frame-card { flex: 0 1 auto; }
  .stage-label { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px 4px; }
  .stage-label .name { font-size: 15px; font-weight: 600; color: var(--txt-hi); }
  .stage-label .code { font-family: var(--font-mono); font-size: 11px; color: var(--white-54); }
  .page-foot {
    max-width: 1120px;
    margin: 8px auto 48px;
    padding: 0 32px;
    font-size: 12px;
    color: var(--white-54);
    line-height: 1.7;
  }
  .page-foot b { color: var(--white-70); font-weight: 600; }

  .phone {
    position: relative;
    width: 390px;
    height: 844px;
    border-radius: 54px;
    border: 1px solid rgba(255,255,255,.10);
    background: #000;
    overflow: hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,.06) inset,
      0 0 0 1px rgba(0,0,0,.4),
      0 32px 80px rgba(0,0,0,.55),
      0 8px 28px rgba(0,0,0,.45);
  }
  .phone::after {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 44px;
    pointer-events: none;
    box-shadow: 0 0 0 1px rgba(255,255,255,.025) inset;
    z-index: 8;
  }

  /* ── 训练完成页（430 设计空间 → 390 视口等比缩放） ─────────── */
  .cf-frame {
    position: absolute;
    top: 0; left: 0;
    width: 430px;
    height: calc(844px / var(--scale));
    transform: scale(var(--scale));
    transform-origin: 0 0;
    display: flex;
    flex-direction: column;
    background: var(--complete-bg);
    overflow: hidden;
  }

  .cf-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  .cf-scroll::-webkit-scrollbar { display: none; }

  .cf-content {
    min-height: 100%;
    padding: 48px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* ── 庆祝头部 ──────────────────────────────────────────────── */
  .cf-hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .cf-badge {
    width: 102px;
    height: 102px;
    border-radius: 51px;
    background: var(--complete-circle);
    border: 1px solid var(--complete-circle-border);
    display: grid;
    place-items: center;
    animation: cf-pop .5s var(--ease) .05s both;
  }
  .cf-badge-icon {
    width: 80px;
    height: 80px;
    display: block;
  }
  .cf-title {
    margin-top: 26px;
    font-size: 36px;
    line-height: 44px;
    font-weight: 700;
    color: var(--txt-hi);
    animation: cf-rise .45s var(--ease) .16s both;
  }
  .cf-sub {
    margin-top: 10px;
    font-size: 18px;
    line-height: 24px;
    font-weight: 400;
    color: var(--complete-sub);
    animation: cf-rise .45s var(--ease) .26s both;
  }

  /* ── 连续记录 chip ─────────────────────────────────────────── */
  .cf-streak {
    margin-top: 30px;
    border-radius: 28px;
    border: 1px solid var(--line-14);
    background: var(--streak-surface);
    padding: 18px;
    animation: cf-rise .5s var(--ease) .36s both;
  }
  .streak-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .streak-title { font-size: 18px; line-height: 1.2; font-weight: 700; color: var(--txt-hi); }
  .streak-count { font-family: var(--font-num); font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .streak-days { display: flex; gap: 8px; }
  .streak-day { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .streak-day .dot { width: 28px; height: 28px; border-radius: 50%; }
  .streak-day.on .dot { background: var(--streak-day-on); }
  .streak-day.off .dot { background: var(--streak-day-off); }
  .streak-day .d { font-size: 11px; line-height: 1; color: var(--white-54); }
  .streak-day.on .d { color: var(--accent); }

  /* ── 底部固定操作区 ────────────────────────────────────────── */
  .cf-dock {
    flex: 0 0 auto;
    padding: 12px 20px 20px;
    background: var(--complete-bg);
    border-top: 1px solid var(--hairline);
    animation: cf-rise .5s var(--ease) .6s both;
  }
  .cf-btn {
    width: 100%;
    height: 52px;
    border-radius: 18px;
    font-size: 16px;
    cursor: pointer;
    transition: filter .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .cf-btn-primary {
    border: 0;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
  }
  .cf-btn-primary:hover { filter: brightness(1.06); }
  .cf-btn-primary:active { transform: scale(.985); }

  /* ── confetti（唯一装饰动效，aria-hidden） ──────────────────── */
  .confetti-layer {
    position: absolute;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    overflow: hidden;
    transition: opacity .5s ease;
  }
  .confetti-piece {
    position: absolute;
    top: -24px;
    border-radius: 2px;
    animation: cf-fall var(--dur, 2.6s) var(--delay, 0s) cubic-bezier(.2, .55, .35, 1) forwards;
  }
  .confetti-piece.c0 { background: var(--accent); }
  .confetti-piece.c1 { background: var(--accent-soft); }
  .confetti-piece.c2 { background: var(--accent-deep); }
  .confetti-piece.c3 { background: var(--complete-check); }
  .confetti-piece.c4 { background: var(--white-90); }

  /* ── toast ─────────────────────────────────────────────────── */
  .cf-toast {
    position: absolute;
    left: 50%;
    bottom: 92px;
    transform: translateX(-50%) translateY(10px);
    max-width: 320px;
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid var(--line-10);
    background: rgba(13,17,23,.92);
    color: var(--txt-hi);
    font-size: 13px;
    line-height: 1.4;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    z-index: 9;
    transition: opacity .18s ease, transform .18s ease;
  }
  .cf-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes cf-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translateY(960px) rotate(var(--rot, 360deg)); opacity: 0; }
  }
  @keyframes cf-pop {
    0% { transform: scale(.82); opacity: 0; }
    60% { transform: scale(1.04); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes cf-rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }

  /* ── 响应式 ───────────────────────────────────────────────── */
  @media (max-width: 860px) {
    .page-header { padding: 32px 20px 4px; }
    .gallery { padding: 24px 20px 8px; justify-content: center; }
    .page-foot { padding: 0 20px; }
  }
  @media (max-width: 440px) {
    .phone { transform-origin: top left; }
    .gallery { padding-left: 16px; padding-right: 16px; }
    .page-header, .page-foot { padding-left: 16px; padding-right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cf-badge, .cf-title, .cf-sub, .cf-streak, .cf-dock { animation: none; }
    .confetti-piece { animation: none; opacity: 0; }
    .cf-btn, .cf-btn-primary { transition: none; }
  }
</style>
</head>
<body>

  <header class="page-header">
    <div class="kicker">FitTracker · Workout Complete</div>
    <h1>训练完成页</h1>
    <p class="page-sub">训练结束后的庆祝确认页，沿用首页 Cold Emerald 设计系统。</p>
    <div class="meta-row">
      <span class="meta-badge">主题 <b>Cold Emerald</b></span>
      <span class="meta-badge">视口 <b>390 × 844</b></span>
      <span class="meta-badge">流程 <b>多邻国式完成</b></span>
      <span class="meta-badge">来源 <b>WorkoutCompletePage</b></span>
    </div>
  </header>

  <main class="gallery">
    <figure class="frame-card" data-od-id="screen-training-complete">
      <div class="stage-label">
        <span class="name">训练完成</span>
        <span class="code">WorkoutCompletePage</span>
      </div>

      <div class="phone">
        <div class="cf-frame">
          <div class="confetti-layer" id="confetti" aria-hidden="true"></div>

          <div class="cf-scroll">
            <div class="cf-content">
              <header class="cf-hero" data-od-id="completion-hero">
                <div class="cf-badge">
                  <svg class="cf-badge-icon" viewBox="0 0 100 100" fill="none" aria-hidden="true">
                    <g transform="translate(16 15) scale(2.85)" stroke="var(--complete-check)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M8 21h8"/>
                      <path d="M12 17v4"/>
                      <path d="M7 4h10l1 5c0 3-2 5-6 5s-6-2-6-5z"/>
                      <path d="M5 4h14"/>
                      <path d="M5 9H3a2 2 0 0 0 2 2"/>
                      <path d="M19 9h2a2 2 0 0 1-2 2"/>
                    </g>
                  </svg>
                </div>
                <h2 class="cf-title">训练完成</h2>
                <p class="cf-sub">今天的训练已保存，做得很好。</p>
              </header>

              <section class="cf-streak" data-od-id="card-streak">
                <div class="streak-head">
                  <h3 class="streak-title">训练连续记录</h3>
                  <span class="streak-count">连续 6 天</span>
                </div>
                <div class="streak-days" role="img" aria-label="本周连续训练记录：周一至周六已打卡，周日未打卡">
                  <div class="streak-day on"><span class="dot"></span><span class="d">一</span></div>
                  <div class="streak-day on"><span class="dot"></span><span class="d">二</span></div>
                  <div class="streak-day on"><span class="dot"></span><span class="d">三</span></div>
                  <div class="streak-day on"><span class="dot"></span><span class="d">四</span></div>
                  <div class="streak-day on"><span class="dot"></span><span class="d">五</span></div>
                  <div class="streak-day on"><span class="dot"></span><span class="d">六</span></div>
                  <div class="streak-day off"><span class="dot"></span><span class="d">日</span></div>
                </div>
              </section>

            </div>
          </div>

          <div class="cf-dock">
            <button type="button" class="cf-btn cf-btn-primary" data-od-id="cta-continue" aria-label="继续查看训练总结">继续</button>
          </div>

          <div class="cf-toast" id="toast" role="status" aria-live="polite" data-od-id="complete-toast"></div>
        </div>
      </div>
    </figure>
  </main>

  <footer class="page-foot">
    <b>完成流程：</b>翡翠 confetti 与完成徽章 → 「训练完成」→ 训练连续记录（连续 6 天）→「继续」进入训练总结。
  </footer>

  <script>
    (function () {
      var confetti = document.getElementById('confetti');
      var toast = document.getElementById('toast');
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var toastTimer = 0;

      function showToast(message) {
        if (!toast) { return; }
        toast.textContent = message;
        window.clearTimeout(toastTimer);
        toast.classList.add('show');
        toastTimer = window.setTimeout(function () {
          toast.classList.remove('show');
        }, 1800);
      }

      // 翡翠 confetti：仅入场一次，尊重 reduced-motion
      if (confetti && !reduceMotion) {
        var palette = ['c0', 'c1', 'c2', 'c3', 'c4'];
        for (var i = 0; i < 38; i++) {
          var p = document.createElement('span');
          p.className = 'confetti-piece ' + palette[i % palette.length];
          p.style.left = (Math.random() * 100).toFixed(1) + '%';
          p.style.width = (6 + Math.random() * 6).toFixed(1) + 'px';
          p.style.height = (10 + Math.random() * 8).toFixed(1) + 'px';
          p.style.setProperty('--dur', (2.2 + Math.random() * 1.6).toFixed(2) + 's');
          p.style.setProperty('--delay', (Math.random() * 0.45).toFixed(2) + 's');
          p.style.setProperty('--rot', (Math.round(Math.random() * 720 - 360)) + 'deg');
          confetti.appendChild(p);
        }
        window.setTimeout(function () {
          if (confetti) { confetti.style.opacity = '0'; }
        }, 4600);
        window.setTimeout(function () {
          if (confetti && confetti.parentNode) { confetti.parentNode.removeChild(confetti); }
        }, 5200);
      }

      var continueBtn = document.querySelector('[data-od-id="cta-continue"]');
      if (continueBtn) {
        continueBtn.addEventListener('click', function () {
          showToast('原型：跳转到训练总结页');
        });
      }

      // 窄屏等比缩小手机画布，避免横向溢出
      var phones = Array.prototype.slice.call(document.querySelectorAll('.phone'));
      function fitPhones() {
        var narrow = window.innerWidth < 440;
        phones.forEach(function (ph) {
          var scale = narrow ? Math.min(1, (window.innerWidth - 32) / 390) : 1;
          ph.style.transform = scale < 1 ? 'scale(' + scale + ')' : '';
          ph.style.transformOrigin = 'top left';
          ph.style.marginBottom = scale < 1 ? ((scale - 1) * 844) + 'px' : '';
        });
      }
      window.addEventListener('resize', fitPhones);
      fitPhones();
    })();
  </script>
  <script>window.FT_APP={routes:[['[data-od-id="cta-continue"]','review']]};</script>
  <script src="assets/ft-stage.js"></script>
</body>
</html>
