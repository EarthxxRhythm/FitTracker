<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FitTracker · 计划页原型</title>
<style>
  /* ─────────────────────────────────────────────────────────────
     FitTracker · Cold Emerald Performance（沿用首页设计系统）
     主题：黑绿深色基底 + 冷翡翠强调 + 深色微层级
  ───────────────────────────────────────────────────────────── */
  :root {
    --ink-0: #0B0F13;
    --ink-1: #0A0D12;
    --ink-welcome-0: #10171B;
    --visual-a: #14241F;
    --visual-b: #0D1616;
    --ring-inner: #0D1117;
    --tab-pill: #141F1D;
    --tab-pill-active: #182422;
    --nav-active: #F3FBF7;
    --nav-inactive: rgba(243,251,247,.56);
    --accent: #50ECA7;
    --accent-deep: #45C9A1;
    --accent-soft: #8CEBCC;
    --cta-a: #47D994;
    --cta-b: #53E7A5;
    --cta-hover-a: #5BE3A5;
    --cta-hover-b: #6BEDB5;
    --on-accent: #07100B;
    --on-accent-2: #08110D;
    --txt-hi: #F7FBF8;
    --txt-body: #EDF6F2;
    --white-90: rgba(243,251,247,.90);
    --white-87: rgba(255,255,255,.87);
    --white-70: rgba(255,255,255,.70);
    --white-65: rgba(255,255,255,.65);
    --white-62: rgba(255,255,255,.62);
    --white-60: rgba(255,255,255,.60);
    --white-54: rgba(255,255,255,.54);
    --white-40: rgba(255,255,255,.40);
    --white-32: rgba(255,255,255,.32);
    --glass-10: rgba(255,255,255,.10);
    --glass-8: rgba(255,255,255,.08);
    --glass-6: rgba(255,255,255,.06);
    --glass-4: rgba(255,255,255,.04);
    --hairline: rgba(255,255,255,.06);
    --line-10: rgba(255,255,255,.10);
    --line-14: rgba(255,255,255,.078);
    --line-16: rgba(255,255,255,.16);
    --accent-40: rgba(80,236,167,.40);
    --accent-32: rgba(69,201,161,.32);
    --accent-20: rgba(80,236,167,.20);
    --accent-18: rgba(69,201,161,.18);
    --accent-12: rgba(80,236,167,.12);
    --accent-10: rgba(80,236,167,.10);
    --accent-07: rgba(80,236,167,.07);
    --font-cn: "Noto Sans SC", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", "Microsoft YaHei UI", sans-serif;
    --font-num: "Inter", "SF Pro Text", -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    --font-mono: "Geist Mono", "JetBrains Mono", "SF Mono", Consolas, "Courier New", monospace;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }

  body {
    overflow-x: hidden;
    background: #07090B;
    color: var(--txt-body);
    font-family: var(--font-cn);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }

  .defs { position: absolute; width: 0; height: 0; overflow: hidden; }

  button { font-family: var(--font-cn); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(80,236,167,.28); }

  /* ── 页面外框（非 App 内容） ─────────────────────────────────── */
  .page-header {
    max-width: 1120px;
    margin: 0 auto;
    padding: 48px 32px 8px;
  }
  .kicker {
    font-family: var(--font-cn);
    font-size: 13px;
    letter-spacing: .02em;
    color: var(--white-54);
    margin-bottom: 12px;
  }
  .page-header h1 {
    font-size: clamp(30px, 4vw, 44px);
    font-weight: 700;
    letter-spacing: 0;
    color: var(--txt-hi);
    line-height: 1.18;
  }
  .page-sub {
    margin-top: 14px;
    font-size: 15px;
    color: var(--white-60);
    line-height: 1.6;
    max-width: 640px;
  }
  .meta-row { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 18px; }
  .meta-badge {
    font-family: var(--font-cn);
    font-size: 12px;
    letter-spacing: .01em;
    color: var(--white-54);
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
  }
  .meta-badge b { color: var(--white-70); font-weight: 500; }

  .gallery {
    max-width: 1120px;
    margin: 0 auto;
    padding: 30px 32px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 40px;
    align-items: flex-start;
  }
  .frame-card { flex: 0 1 auto; }
  .stage-label {
    display: flex; align-items: baseline; gap: 10px;
    margin: 0 0 14px 4px;
  }
  .stage-label .name { font-size: 15px; font-weight: 600; color: var(--txt-hi); }
  .stage-label .code { font-family: var(--font-mono); font-size: 11px; color: var(--white-40); }

  .page-foot {
    max-width: 1120px;
    margin: 8px auto 48px;
    padding: 0 32px;
    font-size: 12px;
    color: var(--white-40);
    line-height: 1.7;
  }
  .page-foot b { color: var(--white-70); font-weight: 600; }

  /* ── 手机画布 ─────────────────────────────────────────────── */
  .phone {
    position: relative;
    width: 390px;
    height: 844px;
    border-radius: 54px;
    border: 1px solid rgba(255,255,255,.10);
    background: #000;
    overflow: hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,.06) inset,
      0 0 0 1px rgba(0,0,0,.4),
      0 32px 80px rgba(0,0,0,.55),
      0 8px 28px rgba(0,0,0,.45);
  }
  .phone::after {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 44px;
    pointer-events: none;
    box-shadow: 0 0 0 1px rgba(255,255,255,.025) inset;
  }

  /* ── AppShell ─────────────────────────────────────────────── */
  .appshell {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--ink-0);
  }
  .viewport { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .pane { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
  .pane.active { opacity: 1; visibility: visible; z-index: 1; }
  .pane-scroll { height: 100%; overflow-y: auto; scrollbar-width: none; }
  .pane-scroll::-webkit-scrollbar { display: none; }

  /* ── 计划页内容 ───────────────────────────────────────────── */
  .plan-content {
    padding: 53px 16px 24px;
    display: flex; flex-direction: column;
    height: 100%;
  }

  /* 当前计划 · 总计划 */
  .current-plan {
    flex: 2 2 0;
    min-height: 0;
  }
  .master-card {
    height: 100%;
    border-radius: 24px;
    border: 1px solid rgba(80,236,167,.22);
    background: rgba(80,236,167,.06);
    box-shadow: 0 14px 28px rgba(0,0,0,.2);
    padding: 14px 16px;
    display: flex; flex-direction: column;
  }
  .mc-top {
    display: flex; align-items: center; justify-content: space-between;
  }
  .mc-label {
    font-size: 12px; font-weight: 700; color: var(--accent);
  }
  .mc-pct {
    font-family: var(--font-num);
    font-size: 11px; font-weight: 700; color: var(--accent);
  }
  .mc-name {
    margin-top: 8px;
    font-size: 22px; font-weight: 700; letter-spacing: -.01em;
    color: var(--txt-hi); line-height: 1.05;
  }
  .mc-meta {
    margin-top: 5px;
    font-size: 11.5px; color: var(--white-62);
  }
  .mc-progress {
    margin-top: auto;
    display: flex; align-items: center; gap: 10px;
  }
  .mc-track {
    flex: 1 1 auto; height: 6px;
    border-radius: 999px; background: rgba(80,236,167,.14);
    overflow: hidden;
  }
  .mc-fill {
    display: block; height: 100%;
    border-radius: 999px; background: var(--accent);
  }
  .mc-count {
    font-family: var(--font-num);
    font-size: 11px; font-weight: 600; color: var(--white-62);
    white-space: nowrap;
  }

  /* 今日计划 · 上一日—今日—下一日 弧形卡片 */
  .today-plan {
    flex: 8 8 0;
    min-height: 0;
    margin-top: 16px;
    display: flex; flex-direction: column;
  }
  .deck-stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex; flex-direction: column;
  }
  .deck {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    touch-action: none;
    user-select: none;
  }
  .deck:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(80,236,167,.28);
    border-radius: 24px;
  }

  .deck-card {
    position: absolute; left: 24px; right: 24px; top: 0; height: 100%;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,.09);
    background: #151B20;
    box-shadow: 0 18px 36px rgba(0,0,0,.32);
    padding: 18px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    will-change: transform, opacity, filter;
  }
  .deck-card.pos-front {
    transform: translateX(0) translateY(0) rotate(0deg) scale(1);
    opacity: 1; filter: none; z-index: 5;
  }
  .deck-card.pos-prev {
    transform: translateX(-86%) translateY(16px) rotate(-6deg) scale(.82);
    opacity: .74; filter: brightness(.9); z-index: 3;
  }
  .deck-card.pos-next {
    transform: translateX(86%) translateY(16px) rotate(6deg) scale(.82);
    opacity: .74; filter: brightness(.9); z-index: 3;
  }
  .deck-card.pos-off-l {
    transform: translateX(-110%) rotate(-8deg) scale(.72);
    opacity: 0; filter: brightness(.7); z-index: 1;
  }
  .deck-card.pos-off-r {
    transform: translateX(110%) rotate(8deg) scale(.72);
    opacity: 0; filter: brightness(.7); z-index: 1;
  }
  .deck.dragging .pos-front { transition: none; }
  @media (prefers-reduced-motion: reduce) {
    .deck-card { transition: none; }
  }

  .dc-main { display: flex; flex-direction: column; }
  .dc-detail { display: flex; flex-direction: column; }
  .dc-top { display: flex; align-items: center; gap: 10px; }
  .dc-num {
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
    color: var(--white-62);
  }
  .dc-type {
    font-size: 10px; color: var(--white-62);
    background: var(--glass-6);
    border: 1px solid var(--hairline);
    border-radius: 999px; padding: 4px 9px;
  }
  .dc-type.is-today {
    color: var(--on-accent);
    background: var(--accent);
    border-color: transparent;
    font-weight: 700;
  }
  .dc-icon {
    margin-left: auto;
    width: 40px; height: 40px;
    border-radius: 12px;
    background: rgba(80,236,167,.10);
    border: 1px solid rgba(80,236,167,.25);
    display: grid; place-items: center;
    color: var(--accent);
  }
  .dc-icon svg { width: 20px; height: 20px; }
  .dc-name {
    margin-top: 16px;
    font-size: 34px; font-weight: 700;
    letter-spacing: 0; line-height: 1.12;
    color: var(--txt-hi);
  }
  .dc-muscle { margin-top: 9px; font-size: 14px; color: var(--white-62); }

  .dc-listhead {
    font-size: 11px; font-weight: 700; letter-spacing: .02em;
    color: var(--white-54);
  }
  .dc-list {
    margin-top: 10px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .ex-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; min-height: 44px;
    padding: 0 10px;
    border-radius: 10px;
    background: var(--glass-6);
  }
  .ex-num {
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 600;
    color: var(--accent); width: 24px;
  }
  .ex-name {
    font-size: 13.5px; font-weight: 600; color: var(--txt-hi);
    white-space: nowrap;
  }
  .ex-muscle {
    flex: 1 1 auto;
    font-size: 11px; color: var(--white-54);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ex-dose {
    font-family: var(--font-num);
    font-size: 12px; font-weight: 600; color: var(--white-62);
    white-space: nowrap;
  }

  /* 占位 Tab（本轮范围外，诚实标注） */
  .pane-placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; padding: 40px 28px; text-align: center;
  }
  .pane-placeholder .ic {
    width: 52px; height: 52px; color: var(--accent);
    margin-bottom: 18px;
  }
  .pane-placeholder .ic svg { width: 100%; height: 100%; }
  .pane-placeholder .t { font-size: 17px; font-weight: 700; color: var(--txt-hi); }
  .pane-placeholder .d {
    margin-top: 8px; font-size: 13px; letter-spacing: .01em;
    color: var(--white-54); line-height: 1.6; max-width: 260px;
  }
  .pane-placeholder .scope {
    margin-top: 18px;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em;
    color: var(--white-40);
    background: var(--glass-6); border: 1px solid var(--hairline);
    border-radius: 999px; padding: 6px 12px;
  }

  /* 底部 Tab 栏 */
  .tabbar {
    flex: 0 0 auto;
    display: flex; gap: 8px;
    padding: 8px 16px;
    background: rgba(8,12,15,.97);
    border-top: 1px solid rgba(255,255,255,.05);
    box-shadow: 0 -8px 28px rgba(0,0,0,.28);
  }
  .tab {
    flex: 1 1 0;
    height: 56px;
    background: transparent;
    border: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-cn);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .02em;
    color: var(--nav-inactive);
    cursor: pointer;
    border-radius: 18px;
    transition: background .16s ease, color .16s ease;
  }
  .tab:hover {
    color: rgba(243,251,247,.82);
  }
  .tab.active {
    color: var(--nav-active);
    font-weight: 600;
  }
  .tab:focus-visible { outline: none; box-shadow: none; }
  .tab-center {
    flex: 1 1 0;
    height: 56px;
    background: transparent;
    border: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .tab-center .pill {
    width: 72px; height: 44px;
    border-radius: 18px;
    border: 0;
    background: var(--accent);
    box-shadow: 0 6px 14px rgba(0,0,0,.30);
    display: grid; place-items: center;
    color: var(--on-accent);
    transition: box-shadow .16s ease, transform .12s ease, filter .16s ease;
  }
  .tab-center .pill .ic { width: 24px; height: 24px; }
  .tab-center .pill .ic svg { width: 100%; height: 100%; }
  .tab-center.active .pill {
    background: var(--accent-deep);
    box-shadow: 0 8px 20px rgba(0,0,0,.34);
  }
  .tab-center:hover .pill { filter: brightness(1.05); }
  .tab-center:active .pill { transform: scale(.96); }
  .tab-center:focus-visible { outline: none; box-shadow: none; }
  .tab-center:focus-visible .pill { box-shadow: 0 0 0 3px rgba(80,236,167,.28); }

  @media (max-width: 640px) {
    .page-header { padding: 32px 20px 4px; }
    .gallery { padding: 24px 20px 8px; }
    .page-foot { padding: 0 20px; }
  }
</style>
</head>

  <header class="page-header">
    <div class="kicker">FitTracker · Plan Rebuild</div>
    <h1>FitTracker 计划页</h1>
    <p class="page-sub">沿用首页冷翡翠主题，重建「计划」页：当前总计划摘要卡 + 按日分布的今日计划卡（上一日—今日—下一日弧形排列）。</p>
    <div class="meta-row">
      <span class="meta-badge">主题 <b>Cold Emerald</b></span>
      <span class="meta-badge">视口 <b>390 × 844</b></span>
      <span class="meta-badge">语言 <b>简体中文</b></span>
      <span class="meta-badge">交互 <b>滑动 · 清单</b></span>
    </div>
  </header>

  <main class="gallery">
    <figure class="frame-card" data-od-id="screen-plan">
      <div class="stage-label">
        <span class="name">计划页</span>
        <span class="code">PencilAppShell · Plan</span>
      </div>
      <div class="phone">
        <div class="appshell">
          <div class="viewport" id="viewport">

            <!-- 计划 -->
            <section class="pane active" id="pane-plan" role="tabpanel" aria-labelledby="tab-plan" data-pane="plan" data-od-id="pane-plan">
              <div class="pane-scroll">
                <div class="plan-content">
                  <section class="current-plan" data-od-id="current-plan" aria-label="当前计划">
                    <article class="master-card" data-od-id="master-plan-card">
                      <div class="mc-top">
                        <span class="mc-label">当前计划</span>
                        <span class="mc-pct">本周 1 / 5 天</span>
                      </div>
                      <h3 class="mc-name">五日增肌计划</h3>
                      <div class="mc-meta">增肌 · 5 练分化 · 6 周推进</div>
                      <div class="mc-progress">
                        <div class="mc-track"><span class="mc-fill" style="width:20%"></span></div>

  <footer class="page-foot">
    <b>重建依据：</b>沿用首页 <b>PencilHomePage.ets</b> 的冷翡翠设计系统（强调色 <b>#50ECA7</b>），将「计划」页补全为当前总计划摘要卡，以及按日分布的上一日—今日—下一日弧形计划卡。底部五栏 Tab 均可用；本页聚焦计划页，其余四页以「本轮范围」占位诚实标注。
  </footer>

  <script>
    (function () {
      var PLANS = {
        hypertrophy: {
          name: '五日增肌计划',
          meta: '增肌 · 5 练分化 · 6 周推进',
          days: [
            {
              tag: '胸', title: '胸部日', focus: '胸部 · 推力', muscle: '胸部', duration: '62 分钟', badge: '今日', today: true,
              exercises: [
                { name: '杠铃平板卧推', muscle: '胸部', sets: '4', reps: '8-12' },
                { name: '上斜哑铃卧推', muscle: '胸部', sets: '3', reps: '8-12' },
                { name: '哑铃飞鸟', muscle: '胸部', sets: '3', reps: '12-15' },
                { name: '绳索夹胸', muscle: '胸部', sets: '3', reps: '12-15' },
                { name: '双杠臂屈伸', muscle: '胸部', sets: '3', reps: '8-12' }
              ]
            },
            {
              tag: '背', title: '背部日', focus: '背部 · 拉力', muscle: '背部', duration: '58 分钟', badge: '明日', today: false,
              exercises: [
                { name: '引体向上', muscle: '背部', sets: '4', reps: '8-12' },
                { name: '杠铃划船', muscle: '背部', sets: '4', reps: '8-12' },
                { name: '高位下拉', muscle: '背部', sets: '3', reps: '10-12' },
                { name: '坐姿划船', muscle: '背部', sets: '3', reps: '10-12' },
                { name: '面拉', muscle: '背部', sets: '3', reps: '12-15' }
              ]
            },
            {
              tag: '腿', title: '腿部日', focus: '腿部 · 力量', muscle: '腿部', duration: '66 分钟', badge: '后天', today: false,
              exercises: [
                { name: '杠铃深蹲', muscle: '腿部', sets: '4', reps: '8-12' },
                { name: '罗马尼亚硬拉', muscle: '腿部', sets: '3', reps: '8-12' },
                { name: '腿举', muscle: '腿部', sets: '3', reps: '10-12' },
                { name: '腿弯举', muscle: '腿部', sets: '3', reps: '12-15' },
                { name: '提踵', muscle: '腿部', sets: '4', reps: '15-20' }
              ]
            },
            {
              tag: '肩', title: '肩部日', focus: '肩部 · 泵感', muscle: '肩部', duration: '52 分钟', badge: '第 4 天', today: false,
              exercises: [
                { name: '杠铃推举', muscle: '肩部', sets: '4', reps: '8-12' },
                { name: '哑铃侧平举', muscle: '肩部', sets: '3', reps: '12-15' },
                { name: '前平举', muscle: '肩部', sets: '3', reps: '12-15' },
                { name: '俯身飞鸟', muscle: '肩部', sets: '3', reps: '12-15' },
                { name: '耸肩', muscle: '肩部', sets: '3', reps: '12-15' }
              ]
            },
            {
              tag: '臂', title: '手臂日', focus: '手臂 · 收尾', muscle: '手臂', duration: '48 分钟', badge: '第 5 天', today: false,
              exercises: [
                { name: '杠铃弯举', muscle: '手臂', sets: '4', reps: '8-12' },
                { name: '哑铃锤式弯举', muscle: '手臂', sets: '3', reps: '10-12' },
                { name: '窄距卧推', muscle: '手臂', sets: '4', reps: '8-12' },
                { name: '绳索下压', muscle: '手臂', sets: '3', reps: '12-15' },
                { name: '集中弯举', muscle: '手臂', sets: '3', reps: '12-15' }
              ]
            }
          ]
        }
      };

      var viewport = document.getElementById('viewport');
      var deckEl = document.getElementById('deck');
      var ORDER = ['home', 'plan', 'workout', 'review', 'profile'];

      var activePlan = 'hypertrophy';
      var activeCard = 0;
      var dragOffset = 0;
      var baseOffset = 0;
      var animId = 0;
      var currentTab = 'plan';
      var token = 0;
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // 恢复上次浏览位置
      try {
        var saved = JSON.parse(localStorage.getItem('fittracker-plan-state') || '{}');
        if (saved && typeof saved.card === 'number') { activeCard = saved.card; }
      } catch (e) {}

      function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

      function renderDeck() {
        var plan = PLANS[activePlan];
        var days = plan.days;
        activeCard = clamp(activeCard, 0, days.length - 1);

        deckEl.innerHTML = '';
        days.forEach(function (d, i) {
          var listHtml = '<div class="dc-list">';
          d.exercises.forEach(function (ex, j) {
            var exNum = (j < 9 ? '0' : '') + (j + 1);
            var dose = ex.sets + ' × ' + ex.reps;
            listHtml +=
              '<div class="ex-item" data-od-id="day-' + i + '-exercise-' + j + '">' +
                '<span class="ex-num">' + exNum + '</span>' +
                '<span class="ex-name">' + ex.name + '</span>' +
                '<span class="ex-muscle">' + ex.muscle + '</span>' +
                '<span class="ex-dose">' + dose + '</span>' +
              '</div>';
          });
          listHtml += '</div>';

          var card = document.createElement('article');
          card.className = 'deck-card';
          card.setAttribute('data-index', i);
          card.setAttribute('data-od-id', 'plan-day-' + i);
          card.innerHTML =
            '<div class="dc-main">' +
              '<div class="dc-top">' +
                '<span class="dc-num">第 ' + (i + 1) + ' 天 · ' + d.tag + '</span>' +
                '<span class="dc-type' + (d.today ? ' is-today' : '') + '">' + d.badge + '</span>' +
                '<span class="dc-icon"><svg><use href="#i-dumbbell"/></svg></span>' +
              '</div>' +
              '<h3 class="dc-name">' + d.title + '</h3>' +
              '<div class="dc-muscle">' + d.focus + ' · ' + d.exercises.length + ' 个动作 · ' + d.duration + '</div>' +
            '</div>' +
            '<div class="dc-detail">' +
              '<div class="dc-listhead">动作清单</div>' +
              listHtml +
            '</div>';
          deckEl.appendChild(card);
        });
        paint();
        syncActive();
      }

      function stepPx() { return (deckEl.offsetWidth - 48) * 0.86; }

      function applyArc(c, u) {
        var au = Math.abs(u);
        var o;
        if (au <= 1) { o = 1 - 0.26 * au; }
        else if (au < 1.2) { o = 0.74 * (1 - (au - 1) / 0.2); }
        else { o = 0; }
        var x = u * stepPx();
        var y = 16 * au;
        var r = 6 * u;
        var s = 1 - 0.18 * Math.min(au, 1.2);
        c.style.transform = 'translateX(' + x.toFixed(1) + 'px) translateY(' + y.toFixed(1) + 'px) rotate(' + r.toFixed(2) + 'deg) scale(' + s.toFixed(3) + ')';
        c.style.opacity = o.toFixed(3);
        c.style.zIndex = Math.max(1, Math.round(100 - au * 30));
        c.style.pointerEvents = (au < 1.2) ? '' : 'none';
      }

      function paint() {
        var cards = deckEl.querySelectorAll('.deck-card');
        cards.forEach(function (c, i) {
          applyArc(c, (i - activeCard) - dragOffset);
        });
      }

      function syncActive() {
        try {
          localStorage.setItem('fittracker-plan-state', JSON.stringify({ plan: activePlan, card: activeCard }));
        } catch (e) {}
      }

      function easeOut(p) { return 1 - Math.pow(1 - p, 3); }

      function animateOffset(target, dur) {
        if (reduceMotion) {
          dragOffset = 0;
          activeCard = clamp(activeCard + Math.round(target), 0, PLANS[activePlan].days.length - 1);
          paint();
          syncActive();
          return;
        }
        var start = dragOffset;
        var t0 = performance.now();
        var id = ++animId;
        function frame(now) {
          if (id !== animId) { return; }
          var p = Math.min(1, (now - t0) / dur);
          dragOffset = start + (target - start) * easeOut(p);
          paint();
          if (p < 1) { requestAnimationFrame(frame); }
          else {
            dragOffset = 0;
            activeCard = clamp(activeCard + Math.round(target), 0, PLANS[activePlan].days.length - 1);
            paint();
            syncActive();
          }
        }
        requestAnimationFrame(frame);
      }

      function advance(dir) {
        var days = PLANS[activePlan].days;
        var to = activeCard + dir;
        if (to < 0 || to >= days.length) { return; }
        animateOffset(dir, 320);
      }

      var dragging = false;
      var moved = false;
      var startX = 0;
      var dx = 0;

      deckEl.addEventListener('pointerdown', function (e) {
        dragging = true;
        moved = false;
        startX = e.clientX;
        dx = 0;
        baseOffset = dragOffset;
        animId++;
        deckEl.setPointerCapture(e.pointerId);
        deckEl.classList.add('dragging');
      });

      deckEl.addEventListener('pointermove', function (e) {
        if (!dragging) { return; }
        dx = e.clientX - startX;
        if (Math.abs(dx) > 6) { moved = true; }
        dragOffset = clamp(baseOffset - dx / stepPx(), -1, 1);
        paint();
      });

      function endDrag(e) {
        if (!dragging) { return; }
        dragging = false;
        deckEl.classList.remove('dragging');
        var days = PLANS[activePlan].days;
        var dir = 0;
        if (moved) {
          if (dragOffset > 0.2) { dir = 1; }
          else if (dragOffset < -0.2) { dir = -1; }
        }
        var to = activeCard + dir;
        if (dir !== 0 && to >= 0 && to < days.length) {
          animateOffset(dir, 320);
        } else {
          animateOffset(0, 260);
        }
        dx = 0;
      }
      deckEl.addEventListener('pointerup', endDrag);
      deckEl.addEventListener('pointercancel', endDrag);

      deckEl.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); advance(1); }
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); advance(-1); }
      });

      // Tab 切换（与首页一致的偏移回弹动效）
      var tabs = Array.prototype.slice.call(document.querySelectorAll('[data-tab]'));
      var panes = Array.prototype.slice.call(document.querySelectorAll('.pane'));
      var tablist = document.querySelector('.tabbar');

      function selectTab(key) {
        if (key === currentTab) { return; }
        var dir = ORDER.indexOf(key) >= ORDER.indexOf(currentTab) ? 1 : -1;
        currentTab = key;
        token += 1;
        var myToken = token;

        tabs.forEach(function (t) {
          var isActive = t.getAttribute('data-tab') === key;
          t.classList.toggle('active', isActive);
          t.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });
        panes.forEach(function (p) {
          p.classList.toggle('active', p.getAttribute('data-pane') === key);
        });

        if (reduceMotion) { return; }
        viewport.style.transition = 'none';
        viewport.style.transform = 'translateX(' + (8 * dir) + 'px) scale(.99)';
        viewport.style.opacity = '.88';
        void viewport.offsetWidth;
        viewport.style.transition = 'transform .16s cubic-bezier(0, 0, .2, 1), opacity .16s ease';
        viewport.style.transform = 'translateX(0) scale(1)';
        viewport.style.opacity = '1';
        setTimeout(function () {
          if (myToken !== token) { return; }
          viewport.style.transition = '';
          viewport.style.transform = '';
          viewport.style.opacity = '';
        }, 160);
      }

      tabs.forEach(function (t) {
        t.addEventListener('click', function () { selectTab(t.getAttribute('data-tab')); });
      });

      tablist.addEventListener('keydown', function (e) {
        var idx = ORDER.indexOf(currentTab);
        var next = null;
        if (e.key === 'ArrowRight') { next = ORDER[(idx + 1) % ORDER.length]; }
        else if (e.key === 'ArrowLeft') { next = ORDER[(idx - 1 + ORDER.length) % ORDER.length]; }
        else if (e.key === 'Home') { next = ORDER[0]; }
        else if (e.key === 'End') { next = ORDER[ORDER.length - 1]; }
        if (next === null) { return; }
        e.preventDefault();
        selectTab(next);
        var target = document.getElementById('tab-' + next);
        if (target) { target.focus(); }
      });

      // 窄屏等比缩小手机画布，避免横向溢出
      var phones = Array.prototype.slice.call(document.querySelectorAll('.phone'));
      function fitPhones() {
        var narrow = window.innerWidth < 440;
        phones.forEach(function (ph) {
          var scale = narrow ? Math.min(1, (window.innerWidth - 32) / 390) : 1;
          ph.style.transform = scale < 1 ? 'scale(' + scale + ')' : '';
          ph.style.transformOrigin = 'top left';
          ph.style.marginBottom = scale < 1 ? ((scale - 1) * 844) + 'px' : '';
        });
      }
      window.addEventListener('resize', fitPhones);

      renderDeck();
      fitPhones();
    })();
  </script>
