name: 功能建议
description: 提出一个改进或新功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前先看一眼 [README 的「已知限制」](../blob/master/README.md#已知限制) 与 [docs/blockers.md](../blob/master/docs/blockers.md)，可能已经在计划里了。

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      options:
        - HarmonyOS 端
        - Android 端
        - 双端一致
        - 服务端 / 同步
        - 工程 / 文档
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的具体问题
      description: 描述场景，不要只写"希望更好用"
      placeholder: 训练到第 3 组时想临时换动作，现在必须退出重建会话
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的解法
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意自己提 PR 实现这个
          required: false
