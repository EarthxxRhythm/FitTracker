name: pages

# 官网静态站发布到 GitHub Pages。
# 与备案无关的过渡方案：earthrhythm.cloud 的解析与 Caddy 配置一律不动，
# 官网用独立地址对外，避免触发腾讯云的未备案开站核查。
# 背景与取舍见 docs/release/beian-website.md §4.6。

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'docs/legal/**'
      - 'tools/build-site.mjs'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # prebuild 会跑 node ../tools/build-site.mjs --legal-out public/legal，
      # 从 docs/legal/*.md 生成法务页，所以需要完整仓库检出（默认即是）。
      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      # 产物自检：少一个就直接失败，避免发布出缺页的站点。
      - name: Verify artifact
        working-directory: web
        run: |
          set -e
          test -f dist/index.html
          test -f dist/legal/privacy.html
          test -f dist/legal/terms.html
          echo "dist files: $(find dist -type f | wc -l)"
          du -sh dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
