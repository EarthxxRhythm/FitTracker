name: Android

on:
  push:
    branches: [master]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: 单元测试（JUnit + Robolectric）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 不引入 android-actions/setup-android：ubuntu runner 已自带 Android SDK 与 cmdline-tools，
      # 该 action 会因预装 sdkmanager 版本不匹配在 --licenses 步骤 exit 1（2026-10-28 实测）。
      # ANDROID_HOME 由 runner 预设，AGP 能自行定位；缺 platform 时由 AGP 自动下载。

      - name: 单元测试
        working-directory: apps/android
        # Windows 上提交的 gradlew 可能不带可执行位（index 里是 100644），
        # 直接 ./gradlew 会 Permission denied（exit 126）。先补权限再跑。
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: apps/android/app/build/reports/tests/
          if-no-files-found: ignore
