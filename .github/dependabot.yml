version: 2
updates:
  # Android 依赖（Gradle 版本目录 + 构建插件）
  - package-ecosystem: "gradle"
    directory: "/apps/android"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "platform:android"]
    commit-message:
      prefix: "chore(android)"

  # GitHub Actions 自身版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
