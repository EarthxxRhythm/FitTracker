<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- 底部 Tab 中间训练键图标（fill-based，24 视框口径）。
       为什么是 fill 而不是 stroke：BottomTabBar 靠 .fillColor(ColorTokens.TEXT_ON_PRIMARY)
       把图标染成深色置于品牌绿药丸上，而 ArkUI 的 fillColor 只替换 fill、对 stroke 无效。
       比例：配重片占视框高度 9.2/24（38%），哑铃在 24px 渲染下才够醒目；
       初版只占 27%，实渲染偏瘦、远看像一条细杠（.rivet/scratch/tab-preview.html 对比可见）。
       几何左右对称于 x=12、上下对称于 y=12：1+23 / 3.6+20.4 / 7.4+16.6 均等于 24；
       9.6+4.8 / 7.4+9.2 / 10.8+2.4 均以 12 为中心。 -->
  <rect x="1" y="9.6" width="2.2" height="4.8" rx="1.1" fill="#50ECA7"/>
  <rect x="3.6" y="7.4" width="3.6" height="9.2" rx="1.8" fill="#50ECA7"/>
  <rect x="16.8" y="7.4" width="3.6" height="9.2" rx="1.8" fill="#50ECA7"/>
  <rect x="20.8" y="9.6" width="2.2" height="4.8" rx="1.1" fill="#50ECA7"/>
  <rect x="7.4" y="10.8" width="9.2" height="2.4" rx="1.2" fill="#50ECA7"/>
</svg>
